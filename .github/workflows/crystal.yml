name: Crystal

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22"
      - name: Install Crystal dependencies
        run: shards install
      - name: Generate sources and build
        run: bundle exec rake
      - name: Verify generated sources are committed
        run: git diff --ignore-all-space --ignore-blank-lines --exit-code -- src
      - name: Run Crystal specs
        run: timeout 90s crystal spec --verbose
      - name: Run CLI specs
        run: bundle exec rspec
